<svg width="1254" height="1254" viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#EBDAB4"/>
      <stop offset="70%" stop-color="#E4CE9F"/>
      <stop offset="100%" stop-color="#D6BC85"/>
    </radialGradient>
    <radialGradient id="field" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EDBF52"/>
      <stop offset="100%" stop-color="#E0A62E"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F0ED"/>
      <stop offset="45%" stop-color="#C3C7C8"/>
      <stop offset="100%" stop-color="#7C8385"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFEEEB"/>
      <stop offset="50%" stop-color="#AEB3B4"/>
      <stop offset="100%" stop-color="#767D7F"/>
    </linearGradient>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#1C1B19" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- aged paper background -->
  <rect width="1254" height="1254" fill="url(#paper)"/>
  <rect width="1254" height="1254" fill="url(#halftone)"/>

  <!-- badge rings -->
  <circle cx="627" cy="627" r="560" fill="none" stroke="#1C1B19" stroke-width="14"/>
  <circle cx="627" cy="627" r="536" fill="#1E6360"/>
  <circle cx="627" cy="627" r="500" fill="url(#field)"/>
  <circle cx="627" cy="627" r="500" fill="url(#halftone)"/>

  <!-- red starburst behind the tap -->
  <g fill="#C64A2E">
    <path d="M627 210 L672 470 L627 420 L582 470 Z"/>
    <path d="M905 300 L720 500 L735 435 L672 452 Z"/>
    <path d="M1010 560 L735 560 L792 522 L748 470 Z"/>
    <path d="M905 900 L730 660 L790 678 L800 612 Z"/>
    <path d="M330 330 L560 500 L500 512 L520 574 Z"/>
    <path d="M250 610 L520 585 L470 620 L512 668 Z"/>
  </g>
  <circle cx="627" cy="560" r="250" fill="#A83B22" opacity="0.35"/>

  <!-- ===== chrome faucet ===== -->
  <g stroke="#1C1B19" stroke-width="9" stroke-linejoin="round">
    <!-- wall mount + horizontal body -->
    <rect x="360" y="470" width="70" height="120" rx="10" fill="url(#chromeV)"/>
    <rect x="418" y="500" width="220" height="66" rx="30" fill="url(#chrome)"/>
    <!-- riser to valve -->
    <rect x="590" y="360" width="80" height="180" rx="20" fill="url(#chromeV)"/>
    <!-- valve knob -->
    <circle cx="630" cy="345" r="52" fill="url(#chrome)"/>
    <circle cx="630" cy="345" r="20" fill="#C64A2E" stroke="#1C1B19" stroke-width="7"/>
    <!-- elbow + downspout -->
    <path d="M590 500 h150 a30 30 0 0 1 30 30 v120 a40 40 0 0 1 -80 0 v-70" fill="url(#chrome)"/>
    <!-- spout mouth -->
    <rect x="676" y="650" width="70" height="34" rx="8" fill="url(#chromeV)"/>
  </g>
  <!-- chrome highlights -->
  <rect x="428" y="510" width="200" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>
  <rect x="600" y="372" width="14" height="150" rx="7" fill="#FFFFFF" opacity="0.45"/>

  <!-- ===== fan of connector cards pouring out ===== -->
  <!-- card template drawn 4x, rotated into a downward fan -->
  <g transform="translate(711 690)">
    <!-- back card: hexagon (server) -->
    <g transform="rotate(26) translate(-70 40)">
      <rect x="-72" y="0" width="144" height="188" rx="18" fill="#2C7A78" stroke="#1C1B19" stroke-width="9"/>
      <polygon points="0,44 44,70 44,120 0,146 -44,120 -44,70" fill="none" stroke="#F2E9D2" stroke-width="11" stroke-linejoin="round"/>
      <circle cx="0" cy="95" r="12" fill="#F2E9D2"/>
    </g>
    <!-- card: gear (tools) -->
    <g transform="rotate(9) translate(-70 66)">
      <rect x="-72" y="0" width="144" height="188" rx="18" fill="#E6B23C" stroke="#1C1B19" stroke-width="9"/>
      <g transform="translate(0 94)" fill="#1C1B19">
        <circle r="34"/>
        <g stroke="#1C1B19" stroke-width="20">
          <line x1="0" y1="-52" x2="0" y2="52"/>
          <line x1="-52" y1="0" x2="52" y2="0"/>
          <line x1="-37" y1="-37" x2="37" y2="37"/>
          <line x1="-37" y1="37" x2="37" y2="-37"/>
        </g>
        <circle r="15" fill="#E6B23C"/>
      </g>
    </g>
    <!-- card: plug (connector) -->
    <g transform="rotate(-8) translate(-70 78)">
      <rect x="-72" y="0" width="144" height="188" rx="18" fill="#C64A2E" stroke="#1C1B19" stroke-width="9"/>
      <g transform="translate(0 94)" stroke="#F2E9D2" stroke-width="12" stroke-linecap="round" fill="none">
        <line x1="-20" y1="-44" x2="-20" y2="-14"/>
        <line x1="20" y1="-44" x2="20" y2="-14"/>
        <rect x="-34" y="-14" width="68" height="40" rx="10" fill="#F2E9D2" stroke="none"/>
        <line x1="0" y1="26" x2="0" y2="58"/>
      </g>
    </g>
    <!-- front card: braces (protocol) -->
    <g transform="rotate(-25) translate(-70 84)">
      <rect x="-72" y="0" width="144" height="188" rx="18" fill="#EDE3CB" stroke="#1C1B19" stroke-width="9"/>
      <text x="0" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#1C1B19" text-anchor="middle">&#123;&#125;</text>
    </g>
  </g>

  <!-- speed lines -->
  <g stroke="#1C1B19" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <line x1="250" y1="470" x2="330" y2="470"/>
    <line x1="240" y1="520" x2="310" y2="520"/>
    <line x1="960" y1="470" x2="1000" y2="450"/>
    <line x1="980" y1="520" x2="1020" y2="510"/>
  </g>
</svg>
